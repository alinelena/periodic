project:
  type: website
  output-dir: _site
  pre-render:
    - python3 scripts/build_site.py
  render:
    - index.qmd
  resources:
    - elements/*.yaml
    - downloads/*
    - assets/periodic.js

website:
  title: "Periodic Table of Elements"
  site-url: "https://periodic.elena.re"
  navbar:
    background: dark
    search: false
    left:
      - text: "Interactive Table"
        href: index.qmd
      - text: "☀️ Downloads (Light)"
        menu:
          - text: "A0 Landscape (Light PDF)"
            href: downloads/periodic-table-a0-light.pdf
            target: _blank
          - text: "A1 Landscape (Light PDF)"
            href: downloads/periodic-table-a1-light.pdf
            target: _blank
          - text: "A2 Landscape (Light PDF)"
            href: downloads/periodic-table-a2-light.pdf
            target: _blank
          - text: "A3 Landscape (Light PDF)"
            href: downloads/periodic-table-a3-light.pdf
            target: _blank
          - text: "A4 Landscape (Light PDF)"
            href: downloads/periodic-table-a4-light.pdf
            target: _blank
          - text: "A5 Landscape (Light PDF)"
            href: downloads/periodic-table-a5-light.pdf
            target: _blank
          - text: "---"
          - text: "Auto-Size Poster (Light PDF)"
            href: downloads/periodic-table-auto-light.pdf
            target: _blank
          - text: "Vector Graphic (Light SVG)"
            href: downloads/periodic-table-light.svg
            target: _blank
      - text: "🌙 Downloads (Dark)"
        menu:
          - text: "A0 Landscape (Dark PDF)"
            href: downloads/periodic-table-a0-dark.pdf
            target: _blank
          - text: "A1 Landscape (Dark PDF)"
            href: downloads/periodic-table-a1-dark.pdf
            target: _blank
          - text: "A2 Landscape (Dark PDF)"
            href: downloads/periodic-table-a2-dark.pdf
            target: _blank
          - text: "A3 Landscape (Dark PDF)"
            href: downloads/periodic-table-a3-dark.pdf
            target: _blank
          - text: "A4 Landscape (Dark PDF)"
            href: downloads/periodic-table-a4-dark.pdf
            target: _blank
          - text: "A5 Landscape (Dark PDF)"
            href: downloads/periodic-table-a5-dark.pdf
            target: _blank
          - text: "---"
          - text: "Auto-Size Poster (Dark PDF)"
            href: downloads/periodic-table-auto-dark.pdf
            target: _blank
          - text: "Vector Graphic (Dark SVG)"
            href: downloads/periodic-table-dark.svg
            target: _blank
    right:
      - icon: github
        href: https://github.com/alinelena/periodic
        target: _blank
        aria-label: GitHub Repository
  page-footer:
    left: "More info: [RSC Periodic Table](https://www.rsc.org/periodic-table){target=_blank}"
    center: "Source & raw data: [GitHub](https://github.com/alinelena/periodic){target=_blank} & [GitLab](https://gitlab.com/drFaustroll/periodic){target=_blank}"
    right: "[YAML Schema](elements/categories.yaml){target=_blank}"

format:
  html:
    theme: cosmo
    css: styles.css
    page-layout: custom
    toc: false
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
          <script>
            (function () {
              try {
                const savedTheme = localStorage.getItem("mlego-theme") || localStorage.getItem("site-theme") || localStorage.getItem("pt-theme") || "default";
                document.documentElement.setAttribute("data-theme", savedTheme);
                document.documentElement.setAttribute("data-bs-theme", savedTheme === "light" ? "light" : "dark");
              } catch (e) {}
            })();
          </script>
    include-after-body:
      - text: |
          <script src="assets/periodic.js"></script>
